/* ---------- Envoi de CV ---------- */
function EnvoiCV({ items, onAppliquer, onFermer }) {
  const [fichier, setFichier] = useState(null);
  const [choix, setChoix] = useState([]);
  const [message, setMessage] = useState("");
  const [apercu, setApercu] = useState("");

  // Adresse temporaire pour ouvrir le CV sans le recopier.
  useEffect(() => {
    if (!fichier) {
      setApercu("");
      return;
    }
    const u = URL.createObjectURL(fichier);
    setApercu(u);
    return () => URL.revokeObjectURL(u);
  }, [fichier]);

  const partagerCV = async () => {
    setMessage("");
    try {
      if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
        await navigator.share({ files: [fichier], title: fichier.name });
        return;
      }
      setMessage("Le partage direct n'est pas disponible ici : ouvre le CV, puis sers-toi du bouton Partager du navigateur.");
    } catch (e) {
      if (!e || e.name !== "AbortError") setMessage("Partage impossible sur cet appareil.");
    }
  };

  const joignables = items.filter((i) => i.email && RE_EMAIL.test(i.email.trim()));
  const muettes = items.filter((i) => !(i.email && RE_EMAIL.test(i.email.trim())));

  const basculer = (id) =>
    setChoix((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));

  const preparer = async () => {
    if (!choix.length) return;
    const adresses = items
      .filter((i) => choix.includes(i.id))
      .map((i) => i.email.trim())
      .join(", ");
    try {
      await navigator.clipboard.writeText(adresses);
      setMessage("Adresses copiées. Ouvre Mail, colle-les, joins ton CV.");
    } catch {
      setMessage(adresses);
    }
    onAppliquer(choix);
  };

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto" style={{ background: C.paper, color: C.texte }}>
      <div
        className="sticky top-0 z-10 flex items-center justify-between px-5 py-3"
        style={{ background: C.ink, color: C.surInk }}
      >
        <button onClick={onFermer} className="text-sm">Fermer</button>
        <span className="text-xs uppercase tracking-widest" style={{ fontFamily: F.mono, color: "#8FB0AB" }}>
          Envoyer un CV
        </span>
        <span className="w-12" />
      </div>

      <div className="mx-auto w-full max-w-3xl space-y-6 px-5 py-6">
        <p className="text-sm" style={{ color: C.muted }}>
          L'app ne peut pas envoyer de mail elle-même. Elle prépare tout : tu choisis ton CV, tu
          peux le relire et le partager vers Mail, puis tu sélectionnes les pistes joignables — elle
          copie leurs adresses et passe ces fiches en « Candidature envoyée » à la date du jour.
        </p>

        <Bloc titre="1 · Ton CV">
          <label
            className="block cursor-pointer rounded-lg px-3 py-3 text-center text-sm"
            style={{ background: C.card, border: `1px solid ${fichier ? C.teal : C.line}` }}
          >
            {fichier ? `${fichier.name} · ${Math.round(fichier.size / 1024)} ko` : "Choisir un fichier"}
            <input
              type="file"
              accept=".pdf,.doc,.docx,application/pdf"
              className="hidden"
              onChange={(e) => setFichier((e.target.files && e.target.files[0]) || null)}
            />
          </label>
          {fichier && (
            <div className="flex gap-2">
              <a
                href={apercu}
                target="_blank"
                rel="noreferrer"
                className="flex-1 rounded-lg py-2 text-center text-sm"
                style={{ background: C.card, border: `1px solid ${C.line}`, color: C.texte }}
              >
                Voir le CV
              </a>
              <button
                onClick={partagerCV}
                className="flex-1 rounded-lg py-2 text-sm"
                style={{ background: C.card, border: `1px solid ${C.line}` }}
              >
                Partager le CV
              </button>
            </div>
          )}
          {fichier && (
            <p className="text-xs" style={{ color: C.muted }}>
              Le fichier reste sur ton téléphone : l'app retient seulement son nom, le temps de
              cette session.
            </p>
          )}
        </Bloc>

        <Bloc titre="2 · Pistes à contacter">
          {!fichier ? (
            <p className="text-sm" style={{ color: C.muted }}>
              Choisis d'abord ton CV.
            </p>
          ) : joignables.length === 0 ? (
            <p className="text-sm" style={{ color: C.muted }}>
              Aucune piste ne comporte d'e-mail valide pour l'instant.
            </p>
          ) : (
            <ul className="space-y-2">
              {joignables.map((i) => (
                <li key={i.id}>
                  <button
                    onClick={() => basculer(i.id)}
                    className="flex w-full items-center gap-3 rounded-lg px-3 py-3 text-left"
                    style={{
                      background: C.card,
                      border: `1px solid ${choix.includes(i.id) ? C.teal : C.line}`,
                    }}
                  >
                    <span
                      className="flex h-5 w-5 shrink-0 items-center justify-center rounded"
                      style={{
                        background: choix.includes(i.id) ? C.teal : "transparent",
                        border: `1px solid ${choix.includes(i.id) ? C.teal : C.line}`,
                        color: C.surInk,
                      }}
                    >
                      {choix.includes(i.id) ? <Check size={13} /> : null}
                    </span>
                    <span className="min-w-0 flex-1">
                      <span className="block truncate text-sm">{i.nom}</span>
                      <span className="block truncate text-xs" style={{ color: C.muted }}>
                        {i.email}
                      </span>
                    </span>
                  </button>
                </li>
              ))}
            </ul>
          )}

          {fichier && muettes.length > 0 && (
            <div className="rounded-lg p-3" style={{ background: C.card, border: `1px dashed ${C.line}` }}>
              <p className="text-xs" style={{ color: C.muted }}>
                Sans e-mail, donc non sélectionnables :
              </p>
              <p className="mt-1 text-xs" style={{ color: C.muted }}>
                {muettes.map((i) => i.nom).join(" · ")}
              </p>
            </div>
          )}
        </Bloc>

        <button
          onClick={preparer}
          disabled={!fichier || !choix.length}
          className="w-full rounded-lg py-3 text-sm"
          style={{
            background: fichier && choix.length ? C.ink : C.line,
            color: C.surInk,
          }}
        >
          Copier les adresses et marquer comme envoyées
          {choix.length ? ` (${choix.length})` : ""}
        </button>

        {message && (
          <p className="whitespace-pre-line text-xs" style={{ color: C.teal }}>
            {message}
          </p>
        )}
        <div className="h-6" />
      </div>

}

/* ---------- Sauvegarde ---------- */
function Sauvegarde({ texte, onFermer, onValider }) {
  const [colle, setColle] = useState("");
  const [erreur, setErreur] = useState("");
  const [info, setInfo] = useState("");

  const nomFichier = `carnet-de-recherche-${isoJour(new Date())}.txt`;

  const telecharger = () => {
    try {
      const blob = new Blob([texte], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = nomFichier;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      setInfo(`Fichier ${nomFichier} envoyé vers tes téléchargements.`);
    } catch {
      setInfo("Le téléchargement a été bloqué. Utilise Partager ou sélectionne le texte ci-dessous.");
    }
  };

  const partager = async () => {
    try {
      await navigator.share({ title: "Carnet de recherche", text: texte });
      setInfo("Partage ouvert : choisis Fichiers ou Notes pour conserver la copie.");
    } catch {
      setInfo("Partage indisponible. Sélectionne le texte ci-dessous pour le copier.");
    }
  };

  const envoyerAClaude = async () => {
    const bloc = `Mets à jour mes rappels de recherche à partir de ces fiches :\n\n${texte}`;
    try {
      await navigator.clipboard.writeText(bloc);
      setInfo("Copié. Colle-le dans la conversation : je crée les rappels.");
    } catch {
      setInfo("Copie refusée. Sélectionne le texte plus bas et demande-moi d'en faire des rappels.");
    }
  };

  const copier = async () => {
    try {
      await navigator.clipboard.writeText(texte);
      setInfo("Copié dans le presse-papiers.");
    } catch {
      setInfo("Copie automatique refusée. Sélectionne le texte ci-dessous.");
    }
  };

  const ouvrirFichier = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => { setColle(String(fr.result || "")); setErreur(""); };
    fr.onerror = () => setErreur("Lecture du fichier impossible.");
    fr.readAsText(f);
  };

  const restaurer = () => {
    const pistes = analyserExport(colle);
    if (!pistes.length) {
      setErreur("Aucune fiche reconnue dans ce texte.");
      return;
    }
    onValider(pistes);
  };

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto" style={{ background: C.paper }}>
      <div
        className="sticky top-0 z-10 flex items-center justify-between px-5 py-3"
        style={{ background: C.ink, color: C.surInk }}
      >
        <button onClick={onFermer} className="text-sm">Fermer</button>
        <span className="text-xs uppercase tracking-widest" style={{ fontFamily: F.mono, color: "#8FB0AB" }}>
          Sauvegarde
        </span>
        <span className="w-12" />
      </div>

      <div className="space-y-8 px-5 py-6">
        {/* Vers Rappels */}
        <section>
          <h3 className="text-xs uppercase tracking-widest" style={{ fontFamily: F.mono, color: C.muted }}>
            Envoyer vers Rappels
          </h3>
          <p className="mt-2 text-sm" style={{ color: C.muted }}>
            Copie tes fiches, colle-les dans la conversation : Claude crée ou met à jour les rappels
            correspondants dans ton iPhone. C'est là que tes données seront conservées.
          </p>
          <button
            onClick={envoyerAClaude}
            className="mt-3 w-full rounded-lg py-3 text-sm"
            style={{ background: C.ink, color: C.surInk }}
          >
            Copier pour Claude
          </button>
        </section>

        {/* Enregistrer */}
        <section>
          <h3 className="text-xs uppercase tracking-widest" style={{ fontFamily: F.mono, color: C.muted }}>
            Enregistrer une copie
          </h3>
          <div className="mt-3 flex flex-wrap gap-2">
            <button
              onClick={telecharger}
              className="flex items-center gap-2 rounded-lg px-3 py-2 text-sm"
              style={{ background: C.ink, color: C.surInk }}
            >
              Télécharger le fichier
            </button>
            {typeof navigator !== "undefined" && navigator.share && (
              <button
                onClick={partager}
                className="flex items-center gap-2 rounded-lg px-3 py-2 text-sm"
                style={{ background: C.card, border: `1px solid ${C.line}` }}
              >
                Partager
              </button>
            )}
            <button
              onClick={copier}
              className="flex items-center gap-2 rounded-lg px-3 py-2 text-sm"
              style={{ background: C.card, border: `1px solid ${C.line}` }}
            >
              <Copy size={15} /> Copier
            </button>
          </div>
          {info && <p className="mt-2 text-xs" style={{ color: C.teal }}>{info}</p>}
          <p className="mt-3 text-xs" style={{ color: C.muted }}>
            Si rien ne se passe, sélectionne ce texte et colle-le dans Notes :
          </p>
          <textarea
            readOnly
            value={texte}
            onFocus={(e) => e.target.select()}
            rows={8}
            placeholder="Aucune fiche à sauvegarder pour l'instant."
            className="mt-2 w-full rounded-lg p-3 text-xs"
            style={{ background: C.card, border: `1px solid ${C.line}`, fontFamily: F.mono }}
          />
        </section>

        {/* Restaurer */}
        <section>
          <h3 className="text-xs uppercase tracking-widest" style={{ fontFamily: F.mono, color: C.muted }}>
            Restaurer
          </h3>
          <p className="mt-2 text-sm" style={{ color: C.muted }}>
            Ouvre un fichier de sauvegarde ou colle son contenu. Les fiches dont le nom existe déjà
            sont ignorées.
          </p>
          <label
            className="mt-3 flex cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-sm"
            style={{ background: C.card, border: `1px solid ${C.line}` }}
          >
            Choisir un fichier
            <input type="file" accept=".txt,.json,text/plain" onChange={ouvrirFichier} className="hidden" />
          </label>
          <textarea
            rows={8}
            value={colle}
            onChange={(e) => { setColle(e.target.value); setErreur(""); }}
            placeholder={"Entreprise : Dataiku\nContact : …"}
            className="mt-3 w-full rounded-lg p-3 text-xs"
            style={{
              background: C.card,
              border: `1px solid ${erreur ? C.brique : C.line}`,
              fontFamily: F.mono,
            }}
          />
          {erreur && (
            <p role="alert" className="mt-1 flex items-start gap-1.5 text-xs" style={{ color: C.brique }}>
              <AlertCircle size={13} className="mt-0.5 shrink-0" />
              {erreur}
            </p>
          )}
          <button
            onClick={restaurer}
            className="mt-3 w-full rounded-lg py-3 text-sm"
            style={{ background: colle ? C.ink : C.line, color: C.surInk }}
          >
            Ajouter ces fiches au carnet
          </button>
        </section>
        <div className="h-6" />
      </div>
    </div>
  );
}

/* ---------- Fiche ---------- */
const texteDUnePiste = (i) =>
  [
    `${i.type === "formation" ? "Formation" : "Entreprise"} : ${i.nom}`,
    i.intitule && `Intitulé : ${i.intitule}`,
    i.source && `Offre vue sur : ${i.source}`,
    i.contactNom && `Contact : ${i.contactNom}`,
    i.tel && `Téléphone : ${i.tel}`,
    i.email && `E-mail : ${i.email}`,
    i.lien && `Lien : ${i.lien}`,
    `Statut : ${statut(i.statutId).label}`,
    i.dateContact && `${champsDates(i.statutId).action} : ${i.dateContact}${i.heure ? " " + i.heure : ""}`,
    i.dateRappel && `Rappel : ${i.dateRappel}`,
    i.commentaire && `Commentaire : ${i.commentaire}`,
  ]
    .filter(Boolean)
    .join("\n");

function Fiche({ piste, onFermer, onValider, onSupprimer, existe }) {
  const [d, setD] = useState({ ...vide(), ...piste });
  const [erreurs, setErreurs] = useState({});
  const [verifie, setVerifie] = useState(false);
  const [confirme, setConfirme] = useState(false);
  const ancres = useRef({});
  const maj = (k, v) =>
    setD((p) => {
      const suivant = { ...p, [k]: v };
      // Un statut sans rappel ne doit pas garder une échéance invisible.
      if (k === "statutId" && !champsDates(v).rappel) suivant.dateRappel = "";
      if (k === "statutId" && !champsDates(v).heure) suivant.heure = "";
      return suivant;
    });

  // Une fois la première tentative faite, les messages se mettent à jour en direct.
  useEffect(() => {
    if (verifie) setErreurs(verifier(d, piste));
  }, [d, verifie, piste]);

  // Le sélecteur s'ouvre sur aujourd'hui, sauf pour une fiche déjà en retard qu'on garde telle quelle.
  const minRappel =
    piste.dateRappel && joursRestants(piste.dateRappel) < 0 ? piste.dateRappel : isoJour(today());

  const alertes = alerter(d);
  const nbErreurs = Object.keys(erreurs).length;

  const [partage, setPartage] = useState("");

  // Feuille de partage iOS quand elle est disponible, copie sinon.
  const partager = async () => {
    const texte = texteDUnePiste(d);
    try {
      await navigator.share({ title: d.nom, text: texte });
      setPartage("");
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
    }
    try {
      await navigator.clipboard.writeText(texte);
      setPartage("Copié — colle-le où tu veux");
    } catch {
      setPartage("Partage indisponible sur cet écran");
    }
    setTimeout(() => setPartage(""), 2500);
  };

  const enregistrer = () => {
    const e = verifier(d, piste);
    setErreurs(e);
    setVerifie(true);
    const premier = Object.keys(e)[0];
    if (premier) {
      const noeud = ancres.current[premier];
      if (noeud && noeud.scrollIntoView) noeud.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    onValider({
      ...d,
      nom: d.nom.trim(),
      intitule: d.intitule.trim(),
      contactNom: d.contactNom.trim(),
      tel: d.tel.trim(),
      email: d.email.trim(),
      lien: normaliserLien(d.lien),
    });
  };

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto" style={{ background: C.paper }}>
      <div
        className="sticky top-0 z-10 flex items-center justify-between px-5 py-3"
        style={{ background: C.ink, color: C.surInk }}
      >
        <button onClick={onFermer} className="text-sm">Fermer</button>
        <span className="text-xs uppercase tracking-widest" style={{ fontFamily: F.mono, color: "#8FB0AB" }}>
          {existe ? "Fiche" : "Nouvelle piste"}
        </span>
        <button onClick={enregistrer} className="text-sm font-medium">Enregistrer</button>
      </div>

      {nbErreurs > 0 && (
        <p
          role="alert"
          className="flex items-center gap-2 px-5 py-2 text-xs"
          style={{ background: "#F6E3DF", color: C.brique }}
        >
          <AlertCircle size={14} />
          {nbErreurs === 1 ? "Un champ est à corriger." : `${nbErreurs} champs sont à corriger.`}
        </p>
      )}

      <div className="mx-auto w-full max-w-5xl px-5 py-6 lg:flex lg:items-start lg:gap-8">
        <div className="space-y-5 lg:flex-1">
        <div className="flex gap-2">
          {[
            { id: "entreprise", label: "Entreprise", Ico: Building2 },
            { id: "formation", label: "Formation", Ico: GraduationCap },
          ].map(({ id, label, Ico }) => (
            <button
              key={id}
              onClick={() => maj("type", id)}
              className="flex flex-1 items-center justify-center gap-2 rounded-2xl py-2.5 text-sm"
              style={
                d.type === id
                  ? { background: `linear-gradient(135deg, ${C.ink} 0%, ${C.inkSoft} 100%)`, color: C.surInk, boxShadow: 'var(--shadow-card)' }
                  : { background: C.card, color: C.muted, border: `1px solid ${C.line}` }
              }
            >
              <Ico size={16} /> {label}
            </button>
          ))}
        </div>

        <Champ
          label={d.type === "formation" ? "Organisme" : "Entreprise"}
          obligatoire
          erreur={erreurs.nom}
          ancre={(n) => (ancres.current.nom = n)}
        >
          <input
            value={d.nom}
            onChange={(e) => maj("nom", e.target.value)}
            placeholder={d.type === "formation" ? "Ex. CNAM" : "Ex. Dataiku"}
            aria-invalid={!!erreurs.nom}
            className="w-full bg-transparent text-base outline-none"
          />
        </Champ>

        <Champ
          label={d.type === "formation" ? "Intitulé de la formation" : "Poste visé"}
          erreur={erreurs.intitule}
          ancre={(n) => (ancres.current.intitule = n)}
        >
          <input
            value={d.intitule}
            onChange={(e) => maj("intitule", e.target.value)}
            aria-invalid={!!erreurs.intitule}
            className="w-full bg-transparent text-base outline-none"
          />
        </Champ>

        <p className="pt-2 text-xs uppercase tracking-widest" style={{ fontFamily: F.mono, color: C.muted }}>
          Coordonnées
        </p>
        <Champ label="Contact" erreur={erreurs.contactNom} ancre={(n) => (ancres.current.contactNom = n)}>
          <input
            value={d.contactNom}
            onChange={(e) => maj("contactNom", e.target.value)}
            aria-invalid={!!erreurs.contactNom}
            className="w-full bg-transparent text-base outline-none"
          />
        </Champ>
        <Champ
          label="Téléphone"
          erreur={erreurs.tel}
          ancre={(n) => (ancres.current.tel = n)}
          action={d.tel && !erreurs.tel ? { valeur: d.tel.replace(/\s/g, ""), Ico: Phone } : null}
        >
          <input
            type="tel"
            inputMode="tel"
            value={d.tel}
            onChange={(e) => maj("tel", e.target.value)}
            placeholder="06 12 34 56 78"
            aria-invalid={!!erreurs.tel}
            className="w-full bg-transparent text-base outline-none"
          />
        </Champ>
        <Champ
          label="E-mail"
          erreur={erreurs.email}
          ancre={(n) => (ancres.current.email = n)}
          action={d.email && !erreurs.email ? { valeur: d.email.trim(), Ico: Mail } : null}
        >
          <input
            type="email"
            inputMode="email"
            autoCapitalize="none"
            autoCorrect="off"
            value={d.email}
            onChange={(e) => maj("email", e.target.value)}
            placeholder="contact@entreprise.fr"
            aria-invalid={!!erreurs.email}
            className="w-full bg-transparent text-base outline-none"
          />
        </Champ>
        <Champ
          label="Lien"
          erreur={erreurs.lien}
          ancre={(n) => (ancres.current.lien = n)}
          lien={d.lien && !erreurs.lien ? { href: normaliserLien(d.lien), Ico: LinkIcon, label: "Ouvrir" } : null}
        >
          <input
            type="url"
            inputMode="url"
            autoCapitalize="none"
            autoCorrect="off"
            value={d.lien}
            onChange={(e) => maj("lien", e.target.value)}
            placeholder="www.entreprise.fr"
            aria-invalid={!!erreurs.lien}
            className="w-full bg-transparent text-base outline-none"
          />
        </Champ>

        <p className="pt-2 text-xs uppercase tracking-widest" style={{ fontFamily: F.mono, color: C.muted }}>
          Suivi
        </p>
        {d.type === "entreprise" && (
          <Champ label="Offre vue sur">
            <select
              value={d.source}
              onChange={(e) => maj("source", e.target.value)}
              className="w-full bg-transparent text-base outline-none"
            >
              <option value="">—</option>
              {SOURCES.map((x) => (
                <option key={x} value={x}>{x}</option>
              ))}
            </select>
          </Champ>
        )}
        <Champ label="Statut" alerte={alertes.statutId}>
          <select
            value={d.statutId}
            onChange={(e) => maj("statutId", e.target.value)}
            className="w-full bg-transparent text-base outline-none"
          >
            {STATUTS.map((s) => (
              <option key={s.id} value={s.id}>{s.label}</option>
            ))}
          </select>
        </Champ>
        <div className="flex items-start gap-3">
          <div className="flex-1">
            <Champ
              label={champsDates(d.statutId).action}
              erreur={erreurs.dateContact}
              alerte={alertes.dateContact}
              compteur={joursRestants(d.dateContact) >= 0 ? compteur(joursRestants(d.dateContact)) : null}
              compteurCouleur={couleurEcheance(joursRestants(d.dateContact))}
              ancre={(n) => (ancres.current.dateContact = n)}
            >
              <input
                type="date"
                value={d.dateContact}
                onChange={(e) => maj("dateContact", e.target.value)}
                aria-invalid={!!erreurs.dateContact}
                className="w-full bg-transparent text-base outline-none"
              />
            </Champ>
          </div>
          {champsDates(d.statutId).heure && (
            <div className="flex-1">
              <Champ
                label="Heure"
                erreur={erreurs.heure}
                alerte={alertes.heure}
                ancre={(n) => (ancres.current.heure = n)}
              >
                <input
                  type="time"
                  value={d.heure}
                  onChange={(e) => maj("heure", e.target.value)}
                  aria-invalid={!!erreurs.heure}
                  className="w-full bg-transparent text-base outline-none"
                />
              </Champ>
            </div>
          )}
          {champsDates(d.statutId).rappel && (
            <div className="flex-1">
              <Champ
                label="Rappel le"
                erreur={erreurs.dateRappel}
                alerte={alertes.dateRappel}
                ancre={(n) => (ancres.current.dateRappel = n)}
              >
                <input
                  type="date"
                  value={d.dateRappel}
                  min={minRappel}
                  onChange={(e) => maj("dateRappel", e.target.value)}
                  aria-invalid={!!erreurs.dateRappel}
                  className="w-full bg-transparent text-base outline-none"
                />
              </Champ>
            </div>
          )}
        </div>
        {d.dateRappel && !erreurs.dateRappel && (
          <p
            className="-mt-2 flex items-center gap-1.5 text-xs"
            style={{ color: couleurEcheance(joursRestants(d.dateRappel), true) }}
          >
            <Bell size={12} />
            <span style={{ fontFamily: F.mono }}>{compteur(joursRestants(d.dateRappel))}</span>
            <span style={{ color: C.muted }}>· demande-moi de le créer dans Rappels</span>
          </p>
        )}

        <Champ
          label="Commentaire"
          erreur={erreurs.commentaire}
          ancre={(n) => (ancres.current.commentaire = n)}
          compteur={d.commentaire.length > MAX.commentaire - 200 ? `${d.commentaire.length}/${MAX.commentaire}` : null}
        >
          <textarea
            rows={4}
            value={d.commentaire}
            onChange={(e) => maj("commentaire", e.target.value)}
            placeholder="Échanges, salaire, financement, prochaine étape…"
            aria-invalid={!!erreurs.commentaire}
            className="w-full resize-none bg-transparent text-base outline-none"
          />
        </Champ>


        {existe && (
          <button
            onClick={partager}
            className="mt-4 w-full rounded-lg py-3 text-sm"
            style={{ background: C.card, border: `1px solid ${C.line}` }}
          >
            {partage || "Partager cette piste"}
          </button>
        )}

        {existe && (
          <button
            onClick={() => (confirme ? onSupprimer(d.id) : setConfirme(true))}
            className="mt-4 flex w-full items-center justify-center gap-2 rounded-lg py-3 text-sm"
            style={{ color: C.brique, border: `1px solid ${C.line}` }}
          >
            <Trash2 size={15} />
            {confirme ? "Confirmer la suppression" : "Supprimer la fiche"}
          </button>
        )}
        <div className="h-6" />
        </div>

        {Array.isArray(d.historique) && d.historique.length > 0 && (
          <section className="mt-8 lg:sticky lg:top-20 lg:order-first lg:mt-0 lg:w-72 lg:shrink-0">
            <p className="text-xs uppercase tracking-widest" style={{ fontFamily: F.mono, color: C.muted }}>
              Historique
            </p>
            <ul className="mt-2 space-y-1">
              {d.historique.map((h, k) => (
                <li
                  key={k}
                  className="rounded-lg px-3 py-2 text-sm"
                  style={{ background: C.card, border: `1px solid ${C.line}` }}
                >
                  <div className="flex items-center gap-2">
                    <span
                      className="h-2 w-2 shrink-0 rounded-full"
                      style={{ background: couleurStatut(h.statutId) }}
                    />
                    <span className="min-w-0 flex-1 truncate">{statut(h.statutId).label}</span>
                    <span className="shrink-0 text-xs" style={{ fontFamily: F.mono, color: C.muted }}>
                      {h.date ? dateCourte(h.date) : "sans date"}
                      {h.heure ? ` ${h.heure}` : ""}
                    </span>
                    <button
                      onClick={() => setD((p) => ({ ...p, historique: p.historique.filter((_, n) => n !== k) }))}
                      aria-label="Retirer cette étape"
                      className="shrink-0"
                    >
                      <X size={14} color={C.muted} />
                    </button>
                  </div>
                  {h.note && (
                    <p className="mt-1 whitespace-pre-line pl-4 text-xs" style={{ color: C.muted }}>
                      {h.note}
                    </p>
                  )}
                </li>
              ))}
            </ul>
          </section>
        )}
      </div>
    </div>
  );
}

function BoutonCopier({ valeur, Ico }) {
  const [etat, setEtat] = useState("");
  const copier = async () => {
    try {
      await navigator.clipboard.writeText(valeur);
      setEtat("fait");
      setTimeout(() => setEtat(""), 2000);
    } catch {
      setEtat("refus");
    }
  };
  return (
    <button
      onClick={copier}
      className="-my-1 flex items-center gap-1 rounded-full px-2 py-1"
      style={{ color: etat === "fait" ? C.vert : C.teal, border: `1px solid ${C.line}` }}
    >
      {etat === "fait" ? <Check size={13} /> : <Ico size={13} />}
      {etat === "fait" ? "Copié" : etat === "refus" ? "Refusé" : "Copier"}
    </button>
  );
}

function Champ({ label, children, lien, action, erreur, alerte, obligatoire, compteur, compteurCouleur, ancre }) {
  const teinte = erreur ? C.brique : alerte ? C.ocre : null;
  return (
    <div ref={ancre}>
      {/* Conteneur neutre : un <label> détournerait le tap du bouton d'action vers la saisie. */}
      <div
        className="block rounded-2xl px-3 py-2.5"
        style={{
          background: C.card,
          border: `1px solid ${teinte || C.line}`,
          boxShadow: erreur ? `0 0 0 2px rgba(178,58,47,.12)` : 'var(--shadow-card)',
        }}
      >
        <div className="mb-1 flex items-center justify-between text-xs" style={{ color: teinte || C.muted }}>
          <span>
            {label}
            {obligatoire && <span style={{ color: C.brique }}> *</span>}
          </span>
          <span className="flex items-center gap-2">
            {compteur && (
              <span style={{ fontFamily: F.mono, color: erreur ? C.brique : compteurCouleur || C.muted }}>{compteur}</span>
            )}
            {action && action.valeur && <BoutonCopier valeur={action.valeur} Ico={action.Ico} />}
            {lien && (
              <a
                href={lien.href}
                target="_blank"
                rel="noreferrer"
                className="-my-1 flex items-center gap-1 rounded-full px-2 py-1"
                style={{ color: C.teal, border: `1px solid ${C.line}` }}
              >
                <lien.Ico size={13} />
                {lien.label}
              </a>
            )}
          </span>
        </div>
        {children}
      </div>
      {(erreur || alerte) && (
        <p
          role={erreur ? "alert" : undefined}
          className="mt-1 flex items-start gap-1.5 px-1 text-xs"
          style={{ color: erreur ? C.brique : C.ocre }}
        >
          {erreur ? <AlertCircle size={13} className="mt-0.5 shrink-0" /> : <AlertTriangle size={13} className="mt-0.5 shrink-0" />}
          {erreur || alerte}
        </p>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("racine")).render(<CarnetDeRecherche />);

</script>
</body>
</html>
