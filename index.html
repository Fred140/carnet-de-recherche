<script>
  function signaler(texte, grave) {
    var b = document.getElementById("panne");
    b.style.display = "block";
    b.style.background = grave ? "#F6E3DF" : "#F3EEE1";
    b.style.color = grave ? "#B23A2F" : "#7A5C1E";
    b.textContent = texte;

    // Un incident signalé doit pouvoir être écarté : sans cela, une erreur
    // sans conséquence reste affichée comme si l'application était en panne.
    if (!b.querySelector("button")) {
      var f = document.createElement("button");
      f.textContent = "Fermer";
      f.style.cssText = "margin-left:.75rem;text-decoration:underline;font:inherit;color:inherit;background:none;border:0";
      f.onclick = function () { b.style.display = "none"; };
      b.appendChild(f);
    }
  }

  window.addEventListener("error", function (e) {
    // Le navigateur masque le détail des erreurs venues d'un autre domaine.
    if (!e.message || e.message === "Script error.") {
      signaler(
        "Un script externe a signalé une erreur dont le navigateur masque le détail. " +
        "L'application continue de fonctionner ; préviens-moi si quelque chose ne répond plus.",
        false
      );
      return;
    }
    var ou = e.filename ? " (" + String(e.filename).split("/").pop() + ":" + e.lineno + ")" : "";
    signaler("Erreur : " + e.message + ou, true);
  });

  // Une promesse rejetée sans traitement ne déclenche pas l'événement « error ».
  window.addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    var m = (r && (r.message || r.error_description || r.msg)) || String(r || "");
    signaler("Requête échouée : " + m, true);
  });

  window.addEventListener("load", function () {
    if (!window.React || !window.ReactDOM) {
      signaler("React n'a pas pu être chargé. Vérifie la connexion, ou héberge la page pour lever le blocage des scripts externes.", true);
    } else if (!window.Babel) {
      signaler("Babel n'a pas pu être chargé.", true);
    } else if (!window.supabase) {
      signaler("La bibliothèque Supabase n'a pas pu être chargée : les données ne seront pas enregistrées.", true);
    }
  });
</script>

  new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("lecture impossible"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("image illisible"));

};

const RE_EMAIL = /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i;
const RE_TEL = /^[+(]?[\d][\d\s.\-()]{5,19}$/;

const normaliserLien = (v) => {
  const t = (v || "").trim();
  if (!t) return "";
  return /^https?:\/\//i.test(t) ? t : `https://${t}`;
};
const lienValide = (v) => {
  try {
    const u = new URL(normaliserLien(v));
    return u.hostname.includes(".") && !u.hostname.endsWith(".");
  } catch {
    return false;
  }
};
const tropLong = (v, n) => (v || "").trim().length > n;

/* Erreurs bloquantes : l'enregistrement s'arrête. */
function verifier(d, initial = {}) {
  const e = {};
  const rappelModifie = d.dateRappel && d.dateRappel !== (initial.dateRappel || "");
  if (!d.nom.trim()) e.nom = "Ce champ est obligatoire.";
  else if (tropLong(d.nom, MAX.nom)) e.nom = `${MAX.nom} caractères maximum.`;

  if (tropLong(d.intitule, MAX.intitule)) e.intitule = `${MAX.intitule} caractères maximum.`;
  if (tropLong(d.contactNom, MAX.contactNom)) e.contactNom = `${MAX.contactNom} caractères maximum.`;

  if (d.tel.trim() && !RE_TEL.test(d.tel.trim()))
    e.tel = "Numéro invalide. Exemple : 06 12 34 56 78";
  if (d.email.trim() && !RE_EMAIL.test(d.email.trim()))
    e.email = "Adresse invalide. Exemple : contact@entreprise.fr";
  if (d.lien.trim() && (!lienValide(d.lien) || tropLong(d.lien, MAX.lien)))
    e.lien = "Adresse web invalide. Exemple : www.cnam.fr";

  if (d.dateContact && !parse(d.dateContact)) e.dateContact = "Date incomplète.";
  if (d.heure && !/^\d{1,2}:\d{2}$/.test(d.heure)) e.heure = "Heure incomplète.";
  if (d.dateRappel && !parse(d.dateRappel)) e.dateRappel = "Date incomplète.";
  else if (rappelModifie && joursRestants(d.dateRappel) < 0)
    e.dateRappel = "Choisis aujourd'hui ou une date à venir.";

  if (tropLong(d.commentaire, MAX.commentaire)) e.commentaire = `${MAX.commentaire} caractères maximum.`;
  return e;
}

/* Alertes : signalées, mais l'enregistrement reste possible. */
function alerter(d) {
  const a = {};
  const dc = parse(d.dateContact);
  const dr = parse(d.dateRappel);
  const j = joursRestants(d.dateRappel);
  if (j !== null && j < 0 && !CLOS.includes(d.statutId))
    a.dateRappel = "Rappel en retard : replanifie-le ou clôture la piste.";
  else if (dc && dr && dr < dc) a.dateRappel = "Le rappel est antérieur à la prise de contact.";
  if (d.heure && !d.dateContact) a.heure = "Heure indiquée sans date d'entretien.";
  if (champsDates(d.statutId).rappel && !d.dateRappel)
    a.statutId = "Sans date de rappel, cette piste ne remontera pas dans les relances.";
  return a;
}

/* ---------- Accès aux données ----------
   Les fiches restent plates côté interface. La base, elle, est normalisée :
   organismes, contacts, pistes, événements. Les deux traducteurs ci-dessous
   sont la seule frontière — aucun composant d'affichage n'a été modifié. */

const SELECTION = `
  id, intitule, statut, date_contact, date_rappel, heure, commentaire, maj_le,
  organismes ( id, nom, type, lien, source ),
  contacts ( id, nom, tel, email ),
  evenements ( statut, date_etape, heure, note, cree_le )
`;

const RE_UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const estIdBase = (v) => RE_UUID.test(String(v || ""));

const hhmm = (t) => String(t || "").slice(0, 5);
const nul = (v) => {
  const t = String(v == null ? "" : v).trim();
  return t === "" ? null : t;
};
const dedoublonnerHistorique = (historique = []) => {
  const vus = new Set();
  return historique.filter((e) => {
    const cle = [
      e && e.statutId,
      e && e.date,
      e && e.heure,
      String((e && e.note) || "").trim(),
    ].join("::");
    if (!cle || vus.has(cle)) return false;
    vus.add(cle);
    return true;
  });
};

// Ligne de la base → fiche telle que l'interface la manipule.
const versFiche = (r) => ({
  id: r.id,
  type: (r.organismes && r.organismes.type) || "entreprise",
  nom: (r.organismes && r.organismes.nom) || "",
  intitule: r.intitule || "",
  contactNom: (r.contacts && r.contacts.nom) || "",
  tel: (r.contacts && r.contacts.tel) || "",
  email: (r.contacts && r.contacts.email) || "",
  lien: (r.organismes && r.organismes.lien) || "",
  source: (r.organismes && r.organismes.source) || "",
  statutId: r.statut,
  dateContact: r.date_contact || "",
  dateRappel: r.date_rappel || "",
  heure: hhmm(r.heure),
  commentaire: r.commentaire || "",
  historique: dedoublonnerHistorique(
    (r.evenements || [])
      .slice()
      .sort((a, b) => new Date(a.cree_le) - new Date(b.cree_le))
      .map((e) => ({
        statutId: e.statut,
        date: e.date_etape || "",
        heure: hhmm(e.heure),
        note: e.note || "",
        quand: new Date(e.cree_le).getTime(),
      }))
  ),
  maj: new Date(r.maj_le).getTime(),
});

// Fiche de l'interface → arguments de la fonction SQL enregistrer_piste.
const versBase = (p) => ({

  p_type: p.type || "entreprise",
  p_nom: String(p.nom || "").trim(),

  p_email: nul(p.email),

  p_source: nul(p.source),

  p_date_rappel: nul(p.dateRappel),
